[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theia"
version = "0.1.0"
description = "THEIA: a local AI-assisted search, OSINT, and download terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "rich>=13.7",
  "rapidfuzz>=3.0",
  "Pillow>=10.0",
  "typer>=0.12",
  "yt-dlp[default]>=2025.1.0",
  "curl-cffi>=0.11,<0.16",
]

[project.optional-dependencies]
dev = ["pylint>=3.0", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
theia = "private_search.app.chat_ui:interactive_chat"
theia-cli = "private_search.app.cli:app"
qt = "private_search.app.cli:app"
private-search = "private_search.app.cli:run_search_alias"
private-download = "private_search.app.cli:run_download_alias"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"
