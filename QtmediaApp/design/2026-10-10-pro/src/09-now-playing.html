<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Now Playing</title>
<link rel="stylesheet" href="pro.css">
<style>
  /* Full-window view. The backdrop is the current cover, scaled and heavily blurred. */
  .sidebar { display: none !important; }
  .np { position: fixed; inset: 0; overflow: hidden; }
  .np-bg { position: absolute; inset: -20%; background: radial-gradient(40% 50% at 30% 40%, #c0663f, transparent 70%), radial-gradient(50% 60% at 75% 60%, #8f2f55, transparent 70%), linear-gradient(140deg, #b5603a, #5a1f38); filter: blur(60px) saturate(115%); }
  .np-shade { position: absolute; inset: 0; background: radial-gradient(80% 80% at 50% 45%, rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .np-inner { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 72px; height: calc(100% - 120px); padding: 0 10%; }
  .collapse { position: absolute; top: 18px; left: 22px; z-index: 2; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; }
  .left { display: grid; justify-items: center; text-align: center; }
  .cover { width: 300px; height: 300px; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .left h2 { margin-top: 22px; font: 650 24px/1.2 var(--display); letter-spacing: -.02em; }
  .left p { margin-top: 4px; color: rgba(255,255,255,.75); font-size: 14px; }
  .left small { margin-top: 4px; color: rgba(255,255,255,.5); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
  .next h3 { margin-bottom: 14px; color: rgba(255,255,255,.6); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .q { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 10px; }
  .q .art { width: 44px; height: 44px; border-radius: 6px; }
  .q strong { display: block; font-size: 15px; font-weight: 600; }
  .q span { color: rgba(255,255,255,.6); font-size: 12.5px; }
  .q.cur { background: rgba(255,255,255,.12); }
  .q:not(.cur) { opacity: .72; }
  .q .d { margin-left: auto; color: rgba(255,255,255,.55); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 26px; display: grid; justify-items: center; gap: 14px; }
  .prog { display: flex; align-items: center; gap: 12px; width: min(560px, 70%); color: rgba(255,255,255,.65); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .prog .bar { flex: 1; height: 4px; background: rgba(255,255,255,.2); }
  .prog .bar i { background: #fff; }
  .ctl { display: flex; align-items: center; gap: 30px; color: rgba(255,255,255,.85); }
  .ctl .ic { width: 22px; height: 22px; }
  .ctl .main { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: #fff; color: #111; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .ctl .main .ic { width: 26px; height: 26px; margin-left: 3px; }
  .side-btn { position: absolute; right: 26px; bottom: 34px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; }
</style></head>
<body data-route="music">
<div class="np">
  <div class="np-bg"></div><div class="np-shade"></div>
  <span class="collapse"><span data-i="down"></span></span>
  <div class="np-inner">
    <div class="left">
      <div class="art a3 cover"></div>
      <h2>Morning Loop</h2>
      <p>The Paper Kites Club</p>
      <small>From your library</small>
    </div>
    <div class="next">
      <h3>Up Next</h3>
      <div class="q cur"><div class="art a3"></div><div><strong>Morning Loop</strong><span>The Paper Kites Club</span></div><span class="d">2:48</span></div>
      <div class="q"><div class="art a5"></div><div><strong>Glasshouse</strong><span>Mira Sol</span></div><span class="d">5:02</span></div>
      <div class="q"><div class="art a2"></div><div><strong>Harbour Lights (Live)</strong><span>Coastline</span></div><span class="d">22:05</span></div>
      <div class="q"><div class="art a4"></div><div><strong>Field Recording No. 2</strong><span>Low Meadow</span></div><span class="d">6:40</span></div>
      <div class="q"><div class="art a6"></div><div><strong>Afterglow</strong><span>Nova Lane</span></div><span class="d">3:55</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="prog"><span>0:58</span><div class="bar"><i style="width:35%"></i></div><span>2:48</span></div>
    <div class="ctl"><span data-i="shuffle"></span><span data-i="prev"></span><span class="main"><span data-i="play"></span></span><span data-i="next"></span><span data-i="repeat"></span></div>
  </div>
  <span class="side-btn"><span data-i="queue"></span></span>
</div>
<script src="shell.js"></script>
</body></html>
