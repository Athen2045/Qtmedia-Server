<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Music</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="soon.css">
<style>
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; }
  .track { display: grid; gap: 9px; min-width: 0; }
  .cover { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .play {
    position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 44px; height: 44px;
    border-radius: 50%; background: var(--violet); color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(6px);
  }
  .play .i { width: 24px; height: 24px; margin-left: 2px; }
  .track.hover .cover { border-color: var(--violet-line); }
  .track.hover .play { opacity: 1; transform: none; }
  .track.playing .cover { border-color: var(--violet); }
  .track.playing .meta strong { color: var(--violet-ink); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 6px; }
  .eq i { width: 3px; border-radius: 1px; background: var(--violet-hi); }
  .meta { display: grid; gap: 1px; min-width: 0; }
  .meta strong { display: flex; align-items: center; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { color: var(--subtle); font-size: 12px; }
  .meta .t { color: inherit; font-size: inherit; overflow: hidden; text-overflow: ellipsis; }
  .noart { display: grid; place-items: center; background: var(--ink-3); color: var(--subtle); }
  .noart .i { width: 34px; height: 34px; }

  .soon-page { position: relative; }
  .bar {
    position: absolute; left: 40px; right: 40px; bottom: 24px;
    display: grid; grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr); align-items: center; gap: 24px;
    padding: 10px 18px 10px 10px; border-radius: 16px; background: var(--ink-2); border: 1px solid var(--line-strong);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now .art { width: 48px; height: 48px; }
  .now strong { display: block; font-size: 13.5px; font-weight: 600; }
  .now span { color: var(--subtle); font-size: 12px; }
  .center { display: grid; justify-items: center; gap: 6px; width: min(460px, 40vw); }
  .transport { display: flex; align-items: center; gap: 18px; color: var(--muted); }
  .transport .main { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--text); color: var(--ink-0); }
  .time { display: flex; align-items: center; gap: 10px; width: 100%; color: var(--subtle); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .time .scrub { flex: 1; height: 4px; border-radius: 4px; background: var(--ink-4); }
  .time .scrub i { display: block; width: 36%; height: 100%; border-radius: 4px; background: var(--violet); }
  .vol { justify-self: end; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .vol .scrub { width: 90px; height: 4px; border-radius: 4px; background: var(--ink-4); }
  .vol .scrub i { display: block; width: 70%; height: 100%; border-radius: 4px; background: var(--muted); }
</style></head>
<body data-route="music">
<main class="page soon-page">
  <div class="page-head">
    <div>
      <div class="eyebrow">Player</div>
      <h1>Music <span class="soon-badge">Coming soon</span></h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px">
      <span class="subtle" style="font-size:13px">6 tracks</span>
      <span class="btn btn-ghost">Recent <span data-i="chevron" class="i-sm"></span></span>
    </div>
  </div>

  <div class="tracks">
    <div class="track playing"><div class="cover art a1"><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong><span class="eq"><i style="height:6px"></i><i style="height:12px"></i><i style="height:8px"></i></span>Night Drive</strong><span>4:01 · MP3</span></div></div>
    <div class="track hover"><div class="cover art a3"><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong>Morning Loop</strong><span>2:48 · MP3</span></div></div>
    <div class="track"><div class="cover art a5"><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong>Glasshouse</strong><span>5:02 · MP3</span></div></div>
    <div class="track"><div class="cover art a2"><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong>Harbour Lights (Live)</strong><span>22:05 · MP3</span></div></div>
    <div class="track"><div class="cover art a4"><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong>Field Recording No. 2</strong><span>6:40 · MP3</span></div></div>
    <div class="track"><div class="cover noart"><span data-i="music"></span><div class="play"><span data-i="play"></span></div></div><div class="meta"><strong><span class="t">A very long track title that keeps going</span></strong><span>6:41 · MP3</span></div></div>
  </div>

  <div class="bar">
    <div class="now"><div class="art a1"></div><div><strong>Night Drive</strong><span>From your library</span></div></div>
    <div class="center">
      <div class="transport"><span data-i="prev"></span><span class="main"><span data-i="pause"></span></span><span data-i="next"></span></div>
      <div class="time"><span>1:27</span><div class="scrub"><i></i></div><span>4:01</span></div>
    </div>
    <div class="vol"><span data-i="volume" class="i-sm"></span><div class="scrub"><i></i></div></div>
  </div>
</main>
<script src="shell.js"></script>
</body></html>
