[package]
name = "qtmedia-app"
version = "0.1.0"
description = "Privacy-focused Qtmedia desktop application"
authors = ["Qtmedia contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qtmedia_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "Qtmedia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "=1.49.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "=3.25.0"
