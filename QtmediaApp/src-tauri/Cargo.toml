[package]
name = "qtmedia-app"
version = "0.1.0"
description = "Privacy-focused Qtmedia desktop application"
authors = ["Qtmedia contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qtmedia_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "Qtmedia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
# Native audio engine decoding (library formats only: FLAC, MP3).
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "id3v2"] }
tokio = { version = "=1.49.0", features = ["sync", "time"] }
# Files "Delete" moves media to the Recycle Bin / Trash instead of erasing it.
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
url = "=2.5.8"
# Native audio engine: shared-mode resampling.
rubato = "=5.0.0"
# Native audio engine: lock-free decoder → render ring buffer.
rtrb = "=0.4.0"
# Private folder: AES-256-GCM vault, Argon2id password key, zeroed key memory.
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
# Native audio engine output (WASAPI shared and exclusive).
wasapi = "=0.24.0"
# Endpoint properties (Bluetooth detection); same version and features wasapi uses.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.25.0"

# Dependencies are built without debug info in dev builds: it was most of the
# multi-GB target/debug cache, and their frames are rarely stepped into. The
# app's own code keeps full debug info.
[profile.dev.package."*"]
debug = false
