[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtmedia-cli"
version = "0.1.0"
description = "Qtmedia command-line search and download tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "rich>=13.7",
  "rapidfuzz>=3.0",
  "Pillow>=10.0",
  "typer>=0.12",
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs>=0.8.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pylint>=3.0", "pytest>=8.0", "ruff>=0.6"]
impersonation = ["curl-cffi>=0.7"]

[project.scripts]
qt = "qtmedia.app.cli:app"
qtmedia-search = "qtmedia.app.cli:run_search_alias"
qtmedia-download = "qtmedia.app.cli:run_download_alias"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"
